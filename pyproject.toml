[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dextor-gemini-cli"
version = "1.0.0"
description = "Agent-optimized polyglot development environment."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "shiv" }
]
dependencies = [
    "pytest",
    "ruff",
]

[project.optional-dependencies]
dev = [
    "pytest-cov",
    "black",
    "isort",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests/py"]
pythonpath = ["src/py"]
